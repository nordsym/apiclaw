name: Recheck free callable APIs
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: callable-recheck
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: node --check scripts/audit-callable.mjs
      - run: node --check scripts/callable-recheck-flag.mjs
      - run: cp src/workspace-public-apis.json /tmp/previous-callable.json
      - run: npm run audit:callable
      - name: Download previous recheck evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --workflow callable-recheck.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and .status == \"completed\")][0].databaseId")
          if [ -z "$prev" ] || [ "$prev" = "null" ]; then
            echo "No previous completed recheck to compare."
            exit 0
          fi
          gh run download "$prev" --name callable-audit --dir /tmp/prior-callable-audit
      - name: Flag eligibility changes for review
        run: node scripts/callable-recheck-flag.mjs --snapshot=/tmp/previous-callable.json --report=docs/ops/callable-audit.json --prior-confirm=/tmp/prior-callable-audit/docs/ops/callable-recheck-confirm.json --confirm-output=docs/ops/callable-recheck-confirm.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: callable-audit
          path: |
            docs/ops/callable-audit.*
            docs/ops/callable-recheck-confirm.json
            src/workspace-public-apis.json
