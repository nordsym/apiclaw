name: Recheck free callable APIs
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: callable-recheck
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: cp src/workspace-public-apis.json /tmp/previous-callable.json
      - run: node scripts/audit-callable.mjs
      - run: node scripts/refresh-callable.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: callable-audit
          path: |
            docs/ops/callable-audit.*
            src/workspace-public-apis.json
      - name: Flag eligibility changes for review
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const old=JSON.parse(readFileSync('/tmp/previous-callable.json'));
          const current=JSON.parse(readFileSync('src/workspace-public-apis.json'));
          const removed=old.filter(x=>!current.some(y=>x.id===y.id));
          const added=current.filter(x=>!old.some(y=>x.id===y.id));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Callable recheck\n${current.length} verified free APIs.\nRemoved: ${removed.map(x=>x.name).join(', ')||'none'}.\nAdded: ${added.map(x=>x.name).join(', ')||'none'}.\nFull results are in the callable-audit artifact. Eligibility changes require a reviewed snapshot refresh.\n`);
          if(removed.length||added.length){console.error('Callable eligibility changed. Review the audit artifact and update the measured snapshot.');process.exitCode=1;}
          JS
