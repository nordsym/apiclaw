name: Publish Package
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # so APIClaw can trigger a publish without a laptop
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'   # ships npm 11.5.1+ required for OIDC
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
        # no NODE_AUTH_TOKEN, no NPM_TOKEN — OIDC only
