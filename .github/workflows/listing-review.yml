name: Listing review checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            landing/package-lock.json
      - run: npm ci
      - run: npm ci --prefix landing
      - run: npx tsc --noEmit
      - run: npx tsc --noEmit -p convex/tsconfig.json
      - run: npx tsc --noEmit -p landing/tsconfig.json
      - run: node --check scripts/audit-callable.mjs
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web-first-call-browser
      - run: npm run test:onboarding-race-browser
      - run: npm run test:listings-browser
      - run: npm run build
      - run: npm run build --prefix landing
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: ESLint changed and new code
        run: npm run lint
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
